name: API CI

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    # A real Postgres with pgvector, so DB-backed tests run in CI exactly like prod.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests read config from these; namespaced OPSPILOT_ per our convention.
      PYTHONPATH: .
      OPSPILOT_ENVIRONMENT: local
      OPSPILOT_SECRET_KEY: ci-test-secret
      OPSPILOT_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint + format check (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck (mypy)
        run: uv run mypy app

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Seed database
        run: uv run python -m app.seed.seed

      - name: Ingest Knowledge Base
        run: uv run python -m app.rag.ingest

      - name: Run Evals Harness (Offline Gate)
        run: uv run python -m app.evals.run --offline --threshold 0.80

      - name: Test (pytest)
        run: uv run pytest -q
