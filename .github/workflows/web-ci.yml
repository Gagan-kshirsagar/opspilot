name: Web CI

# Runs only when the frontend changes — keeps CI fast and focused.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` is deterministic (uses the lockfile) — the right choice for CI.
      - name: Install
        run: npm ci

      - name: Lint (ESLint incl. jsx-a11y)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
